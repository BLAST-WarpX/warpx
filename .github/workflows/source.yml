name: 📜 Source

on:
  push:
    branches:
      - "development"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-source
  cancel-in-progress: true

jobs:
  style:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Non-ASCII characters
      run: .github/workflows/source/hasNonASCII
    - name: TABs
      run: .github/workflows/source/hasTabs
    - name: End-of-Line whitespaces
      run: .github/workflows/source/hasEOLwhiteSpace
    - name: Check test input files
      run: .github/workflows/source/check_inputs.py
    - name: Check default analysis links
      run: .github/workflows/source/check_analysis_file_type.py
    - name: Doxygen
      run: |
        sudo apt update
        sudo apt install -y doxygen texlive-latex-base texlive-latex-extra ghostscript
        .github/workflows/source/doxygen

  zenodo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Zenodo Metadata
        uses: vsoch/zenodo-validator@00643f085e550b329ab56bc79da510ba18b2d547 # main
        with:
          path: '.zenodo.json'
