name: 🪟 Windows

on:
  push:
    branches:
      - "development"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-windows
  cancel-in-progress: true

jobs:

  check_changes:
    name: Analyze
    uses: ./.github/workflows/check_changes.yml

  build_win_msvc:
    name: MSVC C++20 w/o MPI
    runs-on: windows-latest
    needs: check_changes
    if: ${{ github.event.pull_request.draft == false && needs.check_changes.outputs.has_non_docs_changes == 'true' }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: CCache Cache
      uses: actions/cache@v6
      # - once stored under a key, they become immutable (even if local cache path content changes)
      # - for a refresh the key has to change, e.g., hash of a tracked file in the key
      with:
        path: |
          ~/.ccache
          ~/.cache/ccache
        key: ccache-windows-winmsvc-${{ hashFiles('.github/workflows/windows.yml') }}-${{ hashFiles('cmake/dependencies/AMReX.cmake') }}
        restore-keys: |
          ccache-windows-winmsvc-${{ hashFiles('.github/workflows/windows.yml') }}-
          ccache-windows-winmsvc-
    - name: Build & Install
      env:
        # Work-around for windows-latest GH runner issue, see
        # https://github.com/actions/runner-images/issues/10004
        CXXFLAGS: "/D_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR"
      run: |
        cmake -S . -B build               `
              -DCMAKE_BUILD_TYPE=Debug    `
              -DCMAKE_VERBOSE_MAKEFILE=ON `
              -DWarpX_COMPUTE=NOACC       `
              -DWarpX_OPENPMD=ON          `
              -DWarpX_MPI=OFF             `
              -DWarpX_PYTHON=ON           `
              -DWarpX_amrex_repo=https://github.com/ax3l/amrex.git `
              -DWarpX_amrex_branch=92284e9ed2af10d57a4d8a95ea9a5173af1d651c
        if(!$?) { Exit $LASTEXITCODE }
        cmake --build build --config Debug --parallel 4
        if(!$?) { Exit $LASTEXITCODE }

        python3 -m pip install --upgrade pip
        if(!$?) { Exit $LASTEXITCODE }
        python3 -m pip install --upgrade build packaging setuptools[core] wheel
        if(!$?) { Exit $LASTEXITCODE }
        cmake --build build --config Debug --target install
        if(!$?) { Exit $LASTEXITCODE }
        cmake --build build --config Debug --target pip_install
        if(!$?) { Exit $LASTEXITCODE }

    - name: Enable crash dumps
      run: |
        # Windows Error Reporting: no dialog, but a minidump for crashing processes
        $wer = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting"
        New-ItemProperty -Path $wer -Name DontShowUI -PropertyType DWord -Value 1 -Force | Out-Null
        $key = "$wer\LocalDumps"
        if (!(Test-Path $key)) { New-Item -Path $key | Out-Null }
        New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString `
          -Value "$env:RUNNER_TEMP\crashdumps" -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
    - name: Test
      timeout-minutes: 20
      run: |
        $env:PATH += ';C:/Program Files (x86)/WarpX/bin/'

        # TEMPORARY: without the wrapper, AMReX handles CRT reports
        python3 -X faulthandler Examples/Tests/gaussian_beam/inputs_test_3d_gaussian_beam_picmi.py
        if(!$?) { Exit $LASTEXITCODE }
# JSON writes are currently very slow (50min) with MSVC
#  --diagformat=openpmd
    - name: TMP CRT hook assert (prints, no dialog)
      if: ${{ always() }}
      continue-on-error: true
      timeout-minutes: 2
      run: |
        $env:PATH += ';C:/Program Files (x86)/WarpX/bin/'
        python3 -X faulthandler .github/workflows/source/tmp_crt/crt_hook_test.py assert
        Write-Output ("exit code: {0} (0x{0:X8})" -f $LASTEXITCODE)
        Exit 0
    - name: TMP CRT hook abort (message, no hang)
      if: ${{ always() }}
      continue-on-error: true
      timeout-minutes: 2
      run: |
        $env:PATH += ';C:/Program Files (x86)/WarpX/bin/'
        python3 -X faulthandler .github/workflows/source/tmp_crt/crt_hook_test.py abort
        Write-Output ("exit code: {0} (0x{0:X8})" -f $LASTEXITCODE)
        Exit 0
    - name: TMP CRT hook assert (opt-out, expected to hang)
      if: ${{ always() }}
      continue-on-error: true
      timeout-minutes: 2
      env:
        AMREX_DEFAULT_INIT: "amrex.handle_crt_reports=0"
      run: |
        $env:PATH += ';C:/Program Files (x86)/WarpX/bin/'
        python3 -X faulthandler .github/workflows/source/tmp_crt/crt_hook_test.py assert
        Write-Output ("exit code: {0} (0x{0:X8})" -f $LASTEXITCODE)
        Exit 0
    - name: TMP CRT hook finalized (hooks removed, expected to hang)
      if: ${{ always() }}
      continue-on-error: true
      timeout-minutes: 2
      run: |
        $env:PATH += ';C:/Program Files (x86)/WarpX/bin/'
        python3 -X faulthandler .github/workflows/source/tmp_crt/crt_hook_test.py finalized
        Write-Output ("exit code: {0} (0x{0:X8})" -f $LASTEXITCODE)
        Exit 0
    - name: Print crash stacks
      if: ${{ failure() }}
      timeout-minutes: 5
      run: |
        $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
        Get-ChildItem "$env:RUNNER_TEMP\crashdumps" -Filter *.dmp -ErrorAction SilentlyContinue | ForEach-Object {
          Write-Output "=== $($_.Name) ==="
          & $cdb -z $_.FullName -lines -c ".ecxr; kpn 50; q"
        }
    - name: Print Backtraces
      if: ${{ failure() || cancelled() }}
      run: |
        Get-ChildItem -Filter "Backtrace.*" | ForEach-Object {
          Write-Output "=== $($_.Name) ==="
          Get-Content $_.FullName
        }

  build_win_msvc_rtc:
    name: TMP MSVC RTC failure in WarpX
    continue-on-error: true
    runs-on: windows-latest
    needs: check_changes
    if: ${{ github.event.pull_request.draft == false && needs.check_changes.outputs.has_non_docs_changes == 'true' }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: TMP inject run-time check failure
      run: python3 .github/workflows/source/tmp_crt/patch_rtc.py
    - name: CCache Cache
      uses: actions/cache@v6
      # - once stored under a key, they become immutable (even if local cache path content changes)
      # - for a refresh the key has to change, e.g., hash of a tracked file in the key
      with:
        path: |
          ~/.ccache
          ~/.cache/ccache
        key: ccache-windows-winmsvcrtc-${{ hashFiles('.github/workflows/windows.yml') }}-${{ hashFiles('cmake/dependencies/AMReX.cmake') }}
        restore-keys: |
          ccache-windows-winmsvcrtc-${{ hashFiles('.github/workflows/windows.yml') }}-
          ccache-windows-winmsvcrtc-
    - name: Build & Install
      env:
        # Work-around for windows-latest GH runner issue, see
        # https://github.com/actions/runner-images/issues/10004
        CXXFLAGS: "/D_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR"
      run: |
        cmake -S . -B build               `
              -DCMAKE_BUILD_TYPE=Debug    `
              -DCMAKE_VERBOSE_MAKEFILE=ON `
              -DWarpX_COMPUTE=NOACC       `
              -DWarpX_OPENPMD=ON          `
              -DWarpX_MPI=OFF             `
              -DWarpX_PYTHON=ON           `
              -DWarpX_amrex_repo=https://github.com/ax3l/amrex.git `
              -DWarpX_amrex_branch=92284e9ed2af10d57a4d8a95ea9a5173af1d651c
        if(!$?) { Exit $LASTEXITCODE }
        cmake --build build --config Debug --parallel 4
        if(!$?) { Exit $LASTEXITCODE }

        python3 -m pip install --upgrade pip
        if(!$?) { Exit $LASTEXITCODE }
        python3 -m pip install --upgrade build packaging setuptools[core] wheel
        if(!$?) { Exit $LASTEXITCODE }
        cmake --build build --config Debug --target install
        if(!$?) { Exit $LASTEXITCODE }
        cmake --build build --config Debug --target pip_install
        if(!$?) { Exit $LASTEXITCODE }

    - name: Enable crash dumps
      run: |
        # Windows Error Reporting: no dialog, but a minidump for crashing processes
        $wer = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting"
        New-ItemProperty -Path $wer -Name DontShowUI -PropertyType DWord -Value 1 -Force | Out-Null
        $key = "$wer\LocalDumps"
        if (!(Test-Path $key)) { New-Item -Path $key | Out-Null }
        New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString `
          -Value "$env:RUNNER_TEMP\crashdumps" -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
    - name: Test
      timeout-minutes: 20
      run: |
        $env:PATH += ';C:/Program Files (x86)/WarpX/bin/'

        # TEMPORARY: without the wrapper, AMReX handles CRT reports
        python3 -X faulthandler Examples/Tests/gaussian_beam/inputs_test_3d_gaussian_beam_picmi.py
        if(!$?) { Exit $LASTEXITCODE }
# JSON writes are currently very slow (50min) with MSVC
#  --diagformat=openpmd
    - name: Print crash stacks
      if: ${{ failure() }}
      timeout-minutes: 5
      run: |
        $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
        Get-ChildItem "$env:RUNNER_TEMP\crashdumps" -Filter *.dmp -ErrorAction SilentlyContinue | ForEach-Object {
          Write-Output "=== $($_.Name) ==="
          & $cdb -z $_.FullName -lines -c ".ecxr; kpn 50; q"
        }
    - name: Print Backtraces
      if: ${{ failure() || cancelled() }}
      run: |
        Get-ChildItem -Filter "Backtrace.*" | ForEach-Object {
          Write-Output "=== $($_.Name) ==="
          Get-Content $_.FullName
        }

  build_win_clang:
    name: Clang C++20 w/ OMP w/o MPI
    runs-on: windows-2022
    needs: check_changes
    if: ${{ github.event.pull_request.draft == false && needs.check_changes.outputs.has_non_docs_changes == 'true' }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: CCache Cache
      uses: actions/cache@v6
      # - once stored under a key, they become immutable (even if local cache path content changes)
      # - for a refresh the key has to change, e.g., hash of a tracked file in the key
      with:
        path: |
          ~/.ccache
          ~/.cache/ccache
        key: ccache-windows-winclang-${{ hashFiles('.github/workflows/windows.yml') }}-${{ hashFiles('cmake/dependencies/AMReX.cmake') }}
        restore-keys: |
          ccache-windows-winclang-${{ hashFiles('.github/workflows/windows.yml') }}-
          ccache-windows-winclang-
    - name: Build & Install
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\vc\Auxiliary\build\vcvarsall.bat" x64
        cmake -S . -B build   ^
              -G "Ninja"      ^
              -DCMAKE_C_COMPILER=clang-cl   ^
              -DCMAKE_CXX_COMPILER=clang-cl ^
              -DCMAKE_BUILD_TYPE=Debug      ^
              -DCMAKE_VERBOSE_MAKEFILE=ON   ^
              -DWarpX_COMPUTE=OMP           ^
              -DWarpX_EB=OFF                ^
              -DWarpX_PYTHON=ON             ^
              -DWarpX_MPI=OFF               ^
              -DWarpX_OPENPMD=ON
        if errorlevel 1 exit 1
        cmake --build build --config Debug --parallel 4
        if errorlevel 1 exit 1

        cmake --build build --config Debug --target install
        if errorlevel 1 exit 1

        python3 -m pip install --upgrade pip
        if errorlevel 1 exit 1
        python3 -m pip install --upgrade build packaging setuptools[core] wheel
        if errorlevel 1 exit 1
        python3 -m pip install --upgrade -r requirements.txt
        if errorlevel 1 exit 1

        cmake --build build --config Debug --target pip_install
        if errorlevel 1 exit 1

    - name: Test
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\vc\Auxiliary\build\vcvarsall.bat" x64
        set "PATH=C:/Program Files (x86)/WarpX/bin/;%PATH%"

        python3 Examples/Tests/gaussian_beam/inputs_test_3d_gaussian_beam_picmi.py --diagformat=openpmd
        if errorlevel 1 exit 1
